<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{Name}} · {{title}}</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #161412;
      color: #e5e5e5;
      font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
    }
    .demo-box {
      width: 680px;
      max-width: 90vw;
      padding: 20px 24px;
      border: 1px solid #2e2a27;
      border-radius: 8px;
      background: #1c1917;
      box-sizing: border-box;
    }
    .label {
      margin-bottom: 10px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="demo-box">
    <div class="label">示例 1：默认效果</div>
    <{{slug}}></{{slug}}>
  </div>

  <div class="demo-box">
    <div class="label">示例 2：参数变体</div>
    <{{slug}} example="value"></{{slug}}>
  </div>

  <!-- 本地脚本使用普通 script 引入，保证 file:// 下可直接打开 -->
  <script src="./vanilla/{{slug}}.js"></script>
</body>
</html>
