<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component Web · 组件画廊</title>
  <!-- ⚠️ 本文件由 npm run catalog 根据 scripts/gallery.template.html 自动生成，请勿手动编辑 -->
  <style>
    :root {
      color-scheme: dark;
      --bg: #12100f;
      --panel: #1c1917;
      --border: #2e2a27;
      --text: #e7e5e4;
      --muted: #8a8580;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 20px 32px 16px;
      background: rgba(18, 16, 15, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .title-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .count { color: var(--muted); font-size: 13px; }
    .title-row a { margin-left: auto; color: var(--muted); font-size: 13px; text-decoration: none; }
    .title-row a:hover { color: var(--text); }
    .controls { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
    input[type="search"] {
      flex: 0 1 280px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    input[type="search"]:focus { border-color: var(--accent); }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }
    .chip:hover { color: var(--text); }
    .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      padding: 24px 32px 48px;
    }
    .card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      transition: border-color 0.2s;
    }
    .card:hover { border-color: #4a4440; }
    .preview {
      position: relative;
      height: 200px;
      overflow: hidden;
      background: #161412;
      border-bottom: 1px solid var(--border);
    }
    .preview iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      border: 0;
      transform: scale(0.5);
      transform-origin: 0 0;
    }
    .preview img { width: 100%; height: 100%; object-fit: cover; }
    .preview .empty {
      display: grid;
      place-items: center;
      height: 100%;
      color: var(--muted);
      font-size: 13px;
    }
    .body { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 16px; flex: 1; }
    .name-row { display: flex; align-items: center; gap: 8px; }
    .name { font-weight: 600; font-size: 15px; }
    .zh { color: var(--muted); font-size: 13px; }
    .status { margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); }
    .status.stable { color: #4ade80; border-color: #166534; }
    .status.wip { color: #fbbf24; border-color: #854d0e; }
    .status.idea { color: #a78bfa; border-color: #5b21b6; }
    .desc { margin: 0; color: #b5b0ab; font-size: 13px; line-height: 1.6; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { font-size: 11px; color: var(--muted); background: #262220; padding: 2px 6px; border-radius: 4px; }
    .links { display: flex; gap: 12px; margin-top: auto; padding-top: 6px; font-size: 12px; }
    .links a { color: var(--accent); text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .impl { margin-left: auto; color: var(--muted); }
    .none { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 64px 0; }
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <h1>Component Web</h1>
      <span class="count" id="count"></span>
      <a id="catalog-link" href="./CATALOG.md" target="_blank">CATALOG.md →</a>
    </div>
    <div class="controls">
      <input type="search" id="q" placeholder="搜索名称 / 描述 / 标签…">
      <div class="chips" id="cats"></div>
      <div class="chips" id="statuses"></div>
    </div>
  </header>
  <main id="grid"></main>

  <script>
    const DATA = /*__DATA__*/null;
    const STATUSES = [['all', '全部状态'], ['stable', 'stable'], ['wip', 'wip'], ['idea', 'idea']];
    const state = { q: '', cat: 'all', status: 'all' };

    // 线上（GitHub Pages）时 Markdown 链接跳转到 GitHub 渲染页；本地 file:// 时使用相对路径
    const REPO_BLOB = 'https://github.com/perry0804/Component-Web/blob/main/';
    const mdHref = (p) => (location.protocol === 'file:' ? `./${p}` : REPO_BLOB + p);
    document.getElementById('catalog-link').href = mdHref('CATALOG.md');

    const $ = (id) => document.getElementById(id);
    const escapeHtml = (s = '') => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function renderChips(el, items, key) {
      el.innerHTML = items
        .map(([id, label]) => `<button class="chip" data-id="${id}" aria-pressed="${state[key] === id}">${escapeHtml(label)}</button>`)
        .join('');
      el.onclick = (e) => {
        const btn = e.target.closest('.chip');
        if (!btn) return;
        state[key] = btn.dataset.id;
        renderChips(el, items, key);
        renderGrid();
      };
    }

    function previewHtml(c) {
      if (c.demo) return `<iframe src="./${c.demo}" loading="lazy" title="${escapeHtml(c.name)}" tabindex="-1"></iframe>`;
      if (c.preview) return `<img src="./${c.preview}" alt="${escapeHtml(c.name)}" loading="lazy">`;
      return '<div class="empty">暂无演示</div>';
    }

    function renderGrid() {
      const q = state.q.trim().toLowerCase();
      const list = DATA.components.filter((c) => {
        if (state.cat !== 'all' && c.category !== state.cat) return false;
        if (state.status !== 'all' && c.status !== state.status) return false;
        if (!q) return true;
        return [c.name, c.slug, c.title, c.description, ...c.tags].join(' ').toLowerCase().includes(q);
      });

      $('count').textContent = `${list.length} / ${DATA.components.length} 个组件`;
      $('grid').innerHTML = list.length
        ? list.map((c) => `
          <article class="card">
            <div class="preview">${previewHtml(c)}</div>
            <div class="body">
              <div class="name-row">
                <span class="name">${escapeHtml(c.name)}</span>
                <span class="zh">${escapeHtml(c.title)}</span>
                <span class="status ${c.status}">${c.status}</span>
              </div>
              <p class="desc">${escapeHtml(c.description)}</p>
              <div class="tags">${c.tags.map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
              <div class="links">
                ${c.demo ? `<a href="./${c.demo}" target="_blank">演示</a>` : ''}
                <a href="${mdHref(c.readme)}" target="_blank">文档</a>
                <span class="impl">${escapeHtml(c.implementations.join(' · '))}</span>
              </div>
            </div>
          </article>`).join('')
        : '<div class="none">没有匹配的组件</div>';
    }

    renderChips($('cats'), [['all', '全部分类'], ...DATA.categories.map((c) => [c.id, c.label])], 'cat');
    renderChips($('statuses'), STATUSES, 'status');
    $('q').addEventListener('input', (e) => { state.q = e.target.value; renderGrid(); });
    renderGrid();
  </script>
</body>
</html>
